# Runs frontend + backend vitest suites on every PR and on pushes to main.
# Kept intentionally lean — no jobs that need secrets, no lint/typecheck for
# now (we have no TS yet, ESLint is configured but not enforced in CI). When
# we add those gates, extend the matrix below.
#
# This is an npm WORKSPACE repo (root package.json lists ree-tracker,
# ree-tracker-backend and packages/*). There is exactly ONE lockfile, at the
# root, and installs must run from the root — running them inside a workspace
# child fails, and the per-package lockfiles that used to exist are gone. Jobs
# therefore install once at the root and then target a workspace by name.
#
# NOTE for anyone regenerating package-lock.json: delete node_modules FIRST.
#
# npm builds the lockfile from an existing installed tree when one is present.
# The workspace lockfile was first generated on Windows with the old
# per-package node_modules still in place, so it recorded only
# `@rolldown/binding-win32-x64-msvc` — none of the other 14 platform bindings,
# nor the linux variants of rollup, lightningcss, @tailwindcss/oxide or
# @napi-rs/canvas. Every job then died on a Linux runner with
# "Cannot find module '../rolldown-binding.linux-x64-gnu.node'", and `npm
# install` could not repair it either: it trusts the lockfile's package list and
# never learns the missing optional dep exists.
#
# Regenerating with node_modules REMOVED resolves against the registry instead
# and records all platforms, which is what a lockfile is supposed to do. `npm
# ci` is therefore correct again — and preferable, since it is deterministic and
# fails loudly if the lockfile and package.json ever drift apart.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    name: Standing checks (SQL interpolation + route auth/authz)
    runs-on: ubuntu-latest
    # Both scripts use only Node builtins (fs/path) — no install, no DB, fast.
    defaults:
      run:
        working-directory: ree-tracker-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SQL interpolation guard
        run: node scripts/audit-sql-interpolation.js

      # Checks authentication AND authorization: every write to a resource named
      # by a path parameter must be owner-scoped, role-gated, or justified.
      - name: Route auth-coverage guard
        run: node scripts/audit-route-auth.js

      # Scans every git-TRACKED file in the repo, not just backend src: a
      # credential can land anywhere. Enumerating via `git ls-files` means
      # .gitignore is honoured for free.
      - name: Committed-secret guard
        run: node scripts/audit-secrets.js

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    # vite.config.js fails a PRODUCTION build when VITE_BACKEND_URL is unset,
    # because inlining http://localhost:5000 ships an app that cannot reach its
    # API. CI has no .env (it is gitignored), so it supplies an explicit
    # placeholder: this job proves the bundle BUILDS, it never deploys. The guard
    # still protects the real Vercel build, which must get the value from the
    # project environment.
    env:
      VITE_BACKEND_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm run test --workspace=ree-tracker

      - name: Build
        run: npm run build --workspace=ree-tracker

      # Reads the BUILT index.html, so it has to run after the build. Catches a
      # manualChunks rule that quietly turns lazy code into a static entry
      # import — three such regressions shipped before this existed (#90, #94,
      # and the 398 kB latex chunk this step was added with).
      - name: Boot-payload budget
        run: npm run check:bundle --workspace=ree-tracker

  backend:
    name: Backend (vitest)
    runs-on: ubuntu-latest
    # DATABASE_URL is a dummy — vitest doesn't connect, but Prisma's config
    # loader resolves env vars eagerly during `prisma generate` (which is
    # now fired automatically by package.json's `postinstall` + `pretest`
    # hooks), and would fail with PrismaConfigEnvError otherwise.
    env:
      DATABASE_URL: postgresql://localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm run test --workspace=ree-tracker-backend

  lighthouse:
    name: Lighthouse CI (entry-path budgets)
    runs-on: ubuntu-latest
    # See the frontend job: a production build needs an explicit API origin.
    env:
      VITE_BACKEND_URL: http://localhost:5000
    defaults:
      run:
        working-directory: ree-tracker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace
        run: npm ci --no-audit --no-fund
        working-directory: .

      - name: Build
        run: npm run build

      # Budgets: a11y >=0.95 hard-fails; LCP/CLS/TBT are warnings (CI is noisy).
      # Only the auth-gated entry/login path is reachable in CI (see lighthouserc.cjs).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
