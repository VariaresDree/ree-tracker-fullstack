# Runs frontend + backend vitest suites on every PR and on pushes to main.
# Kept intentionally lean — no jobs that need secrets, no lint/typecheck for
# now (we have no TS yet, ESLint is configured but not enforced in CI). When
# we add those gates, extend the matrix below.
#
# This is an npm WORKSPACE repo (root package.json lists ree-tracker,
# ree-tracker-backend and packages/*). There is exactly ONE lockfile, at the
# root, and `npm ci` must run from the root — running it inside a workspace
# child fails, and the per-package lockfiles that used to exist are gone. Jobs
# therefore install once at the root and then target a workspace by name.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    name: Standing checks (SQL interpolation + route auth/authz)
    runs-on: ubuntu-latest
    # Both scripts use only Node builtins (fs/path) — no install, no DB, fast.
    defaults:
      run:
        working-directory: ree-tracker-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SQL interpolation guard
        run: node scripts/audit-sql-interpolation.js

      # Checks authentication AND authorization: every write to a resource named
      # by a path parameter must be owner-scoped, role-gated, or justified.
      - name: Route auth-coverage guard
        run: node scripts/audit-route-auth.js

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace
        run: npm ci

      - name: Test
        run: npm run test --workspace=ree-tracker

      - name: Build
        run: npm run build --workspace=ree-tracker

  backend:
    name: Backend (vitest)
    runs-on: ubuntu-latest
    # DATABASE_URL is a dummy — vitest doesn't connect, but Prisma's config
    # loader resolves env vars eagerly during `prisma generate` (which is
    # now fired automatically by package.json's `postinstall` + `pretest`
    # hooks), and would fail with PrismaConfigEnvError otherwise.
    env:
      DATABASE_URL: postgresql://localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace
        run: npm ci

      - name: Test
        run: npm run test --workspace=ree-tracker-backend

  lighthouse:
    name: Lighthouse CI (entry-path budgets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ree-tracker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # Budgets: a11y >=0.95 hard-fails; LCP/CLS/TBT are warnings (CI is noisy).
      # Only the auth-gated entry/login path is reachable in CI (see lighthouserc.cjs).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
